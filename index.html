<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Habit Tracker</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* Input Form */
        .habit-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .habit-form input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
        }

        .habit-form button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .habit-form button:hover {
            background-color: var(--primary-hover);
        }

        /* Habit Cards */
        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .habit-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .habit-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .streak-badge {
            background-color: #fef3c7;
            color: #d97706;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: 600;
            margin-left: 15px;
        }

        /* 30 Day Grid */
        .grid-30 {
            display: grid;
            grid-template-columns: repeat(10, 15fr);
            gap: 8px;
        }

        @media (max-width: 600px) {
            .grid-30 {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .day-box {
            aspect-ratio: 1;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            background-color: #f9fafb;
            color: #9ca3af;
        }

        .day-box:hover {
            border-color: var(--primary-color);
        }

        .day-box.completed {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>30-Day Habit Tracker</h1>
            <p>Track your daily habits and build streaks!</p>
        </header>

        <form class="habit-form" id="habitForm">
            <input type="text" id="habitInput" placeholder="Enter a new habit (e.g., Read 30 mins, Exercise)..." required autocomplete="off">
            <button type="submit">Add Habit</button>
        </form>

        <div class="habit-list" id="habitList">
            </div>
    </div>

    <script>
        // DOM Elements
        const habitForm = document.getElementById('habitForm');
        const habitInput = document.getElementById('habitInput');
        const habitList = document.getElementById('habitList');

        // State: Load habits from localStorage, or initialize empty array
        let habits = JSON.parse(localStorage.getItem('habits')) || [];

        // Save to LocalStorage
        function saveHabits() {
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        // Calculate Current Streak
        function calculateStreak(history) {
            let currentStreak = 0;
            // Iterate backwards from day 30 down to 1
            for (let i = 30; i >= 1; i--) {
                if (history.includes(i)) {
                    currentStreak++;
                } else {
                    // Break the streak loop only if we have already started counting a streak
                    if (currentStreak > 0) break;
                }
            }
            return currentStreak;
        }

        // Render Habits in UI
        function renderHabits() {
            habitList.innerHTML = '';

            if (habits.length === 0) {
                habitList.innerHTML = '<p style="text-align: center; color: #6b7280;">No habits added yet. Start by adding one above!</p>';
                return;
            }

            habits.forEach(habit => {
                const streak = calculateStreak(habit.history);
                
                // Create Card Container
                const card = document.createElement('div');
                card.className = 'habit-card';

                // Create Header Row
                const header = document.createElement('div');
                header.className = 'habit-header';
                header.innerHTML = `
                    <div>
                        <h3 class="habit-title">${habit.name}</h3>
                    </div>
                    <div>
                        <span class="streak-badge">🔥 ${streak} Day Streak</span>
                        <button class="delete-btn" onclick="deleteHabit('${habit.id}')">Delete</button>
                    </div>
                `;
                card.appendChild(header);

                // Create 30-Day Grid
                const grid = document.createElement('div');
                grid.className = 'grid-30';

                for (let day = 1; day <= 30; day++) {
                    const dayBox = document.createElement('div');
                    dayBox.className = `day-box ${habit.history.includes(day) ? 'completed' : ''}`;
                    dayBox.textContent = day;

                    // Add click event to toggle day status
                    dayBox.addEventListener('click', () => toggleDay(habit.id, day));
                    grid.appendChild(dayBox);
                }

                card.appendChild(grid);
                habitList.appendChild(card);
            });
        }

        // Add New Habit
        habitForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const habitName = habitInput.value.trim();
            if (!habitName) return;

            const newHabit = {
                id: Date.now().toString(),
                name: habitName,
                history: [] // Holds completed days (e.g., [1, 2, 5])
            };

            habits.push(newHabit);
            saveHabits();
            renderHabits();
            habitInput.value = '';
        });

        // Toggle Day Completion
        function toggleDay(habitId, day) {
            habits = habits.map(habit => {
                if (habit.id === habitId) {
                    if (habit.history.includes(day)) {
                        // Remove day if already completed
                        habit.history = habit.history.filter(d => d !== day);
                    } else {
                        // Add day if not completed
                        habit.history.push(day);
                    }
                }
                return habit;
            });
            saveHabits();
            renderHabits();
        }

        // Delete Habit
        window.deleteHabit = function(habitId) {
            if (confirm('Are you sure you want to delete this habit?')) {
                habits = habits.filter(habit => habit.id !== habitId);
                saveHabits();
                renderHabits();
            }
        }

        // Initial Render on Page Load
        renderHabits();
    </script>
</body>
</html>
